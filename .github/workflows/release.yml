name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest
          python -m pip install -e .
      - name: Python tests
        run: python -m pytest -q
      - name: Build wheel and sdist
        run: python -m build --outdir dist
      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Smoke standalone web (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd web
          PORT=3199 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/lyvideo-web.log 2>&1 &
          echo $! > /tmp/lyvideo-web.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3199/api/subtitle-video/env > /tmp/lyvideo-env.json; then break; fi
            sleep 1
          done
          kill "$(cat /tmp/lyvideo-web.pid)" 2>/dev/null || true
          python - <<'PY'
          import json
          d = json.load(open('/tmp/lyvideo-env.json'))
          print('platform', d.get('platform'), 'python', d.get('python', {}).get('source'), 'ready', d.get('ready'))
          assert d.get('python', {}).get('ok'), d
          assert d.get('ffmpeg') is not None
          PY
      - name: Smoke standalone web (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PORT = "3199"
          $env:HOSTNAME = "127.0.0.1"
          $stdout = Join-Path $env:TEMP "lyvideo-web-out.log"
          $stderr = Join-Path $env:TEMP "lyvideo-web-err.log"
          $p = Start-Process -FilePath "node" -ArgumentList ".next/standalone/server.js" -WorkingDirectory "web" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 3
          $envJson = $null
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $envJson = Invoke-RestMethod -Uri "http://127.0.0.1:3199/api/subtitle-video/env" -TimeoutSec 3
              break
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          if ($null -eq $envJson) {
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            throw "standalone web did not start"
          }
          Stop-Process -Id $p.Id -Force
          $envJson | ConvertTo-Json -Depth 5
          if (-not $envJson.python.ok) { throw "python was not resolved" }
      - name: Package release (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/${{ matrix.platform }}
          zip -rq release/${{ matrix.platform }}/lyvideo-${{ github.ref_name }}-${{ matrix.platform }}.zip README.md pyproject.toml lyvideo tests web/package.json web/package-lock.json web/next.config.mjs web/tailwind.config.ts web/postcss.config.mjs web/tsconfig.json web/src web/scripts web/.next/standalone dist
          cd release/${{ matrix.platform }}
          shasum -a 256 *.zip > SHA256SUMS-${{ matrix.platform }}
      - name: Package release (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/${{ matrix.platform }} | Out-Null
          $zip = "release/${{ matrix.platform }}/lyvideo-${{ github.ref_name }}-${{ matrix.platform }}.zip"
          $files = @("README.md","pyproject.toml","lyvideo","tests","web/package.json","web/package-lock.json","web/next.config.mjs","web/tailwind.config.ts","web/postcss.config.mjs","web/tsconfig.json","web/src","web/scripts","web/.next/standalone","dist")
          tar.exe -a -c -f $zip $files
          if ($LASTEXITCODE -ne 0) { throw "tar.exe failed: $LASTEXITCODE" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -Encoding ascii "release/${{ matrix.platform }}/SHA256SUMS-${{ matrix.platform }}"
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/${{ matrix.platform }}/*.zip
            release/${{ matrix.platform }}/SHA256SUMS-*

  finalize:
    name: finalize checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download release zips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern '*.zip' --dir release
          cd release
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Upload aggregate SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" release/SHA256SUMS --repo "${GITHUB_REPOSITORY}" --clobber

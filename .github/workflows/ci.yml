name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Python tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web build
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Smoke standalone web
        shell: bash
        run: |
          set -euo pipefail
          cd web
          PORT=3199 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/lyvideo-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3199/api/subtitle-video/env > /tmp/lyvideo-env.json; then break; fi
            sleep 1
          done
          python - <<'PY'
          import json
          d = json.load(open('/tmp/lyvideo-env.json'))
          print('platform', d.get('platform'), 'python', d.get('python', {}).get('source'), 'ffmpeg', d.get('ffmpeg', {}).get('ok'))
          assert d.get('python', {}).get('ok'), d
          assert d.get('ffmpeg', {}).get('ok'), d
          PY
